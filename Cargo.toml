[package]
name = "security-assessment-coverage-reporter"
default-run = "security-assessment-coverage-reporter"
version = "0.1.0"
authors = ["Rana Jahanzaib"]
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Offline security assessment completeness auditor"
readme = "README.md"
repository = "https://github.com/ranajahanzaib/security-assessment-coverage-reporter"
keywords = ["security", "assessment", "nmap", "owasp-zap", "nuclei"]
exclude = ["/PLAN.md"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-saphyr = "0.0.16"
quick-xml = "0.38"
sha2 = "0.10.9"
schemars = "1.2.3"
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.12.0"
