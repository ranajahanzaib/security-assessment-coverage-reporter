name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: cargo check --all-targets --locked
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: cargo package --locked
      - name: Exercise offline policy examples
        run: |
          target/debug/security-assessment-coverage-reporter analyze --manifest examples/complete-assessment/scanreceipt.yaml --out complete.json
          target/debug/security-assessment-coverage-reporter check --receipt complete.json
          target/debug/security-assessment-coverage-reporter analyze --manifest examples/incomplete-assessment/scanreceipt.yaml --out incomplete.json --html incomplete.html
          if target/debug/security-assessment-coverage-reporter check --receipt incomplete.json; then
            echo 'Expected incomplete assessment to fail policy' >&2
            exit 1
          else
            status=$?
            test "$status" -eq 2
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: security-assessment-coverage-reporter-examples
          path: |
            complete.json
            incomplete.json
            incomplete.html
